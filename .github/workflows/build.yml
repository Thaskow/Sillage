name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch replaces its build; a tag build always runs to the end
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            platform: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            platform: darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            platform: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p "require('./src-tauri/tauri.conf.json').version")"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag invalide : $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          npm ci
          npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "{\"version\":\"$VERSION\"}"

      - name: Collect
        shell: bash
        run: |
          b="target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          case "${{ matrix.platform }}" in
            windows-x86_64)
              cp "$b/nsis/Sillage_${VERSION}_x64-setup.exe" out/ ;;
            darwin-aarch64)
              cp "$b"/dmg/*.dmg "out/Sillage_${VERSION}_aarch64.dmg"
              tar -czf out/Sillage_aarch64.app.tar.gz -C "$b/macos" Sillage.app ;;
            darwin-x86_64)
              cp "$b"/dmg/*.dmg "out/Sillage_${VERSION}_x64.dmg"
              tar -czf out/Sillage_x64.app.tar.gz -C "$b/macos" Sillage.app ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  # signs from the build artifacts only: no build tool or project dependency runs next to the signing key,
  # and this job cannot write to the repository.
  # Runs even if a macOS bundle is missing (GitHub regularly lacks macOS arm64 runners): Windows is still
  # published, and "Re-run failed jobs" later adds the missing platform to the same release and latest.json.
  sign:
    needs: bundle
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist

      - name: Version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag invalide : $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Bundles present
        run: |
          test -f "dist/Sillage_${VERSION}_x64-setup.exe" || { echo "Installateur Windows absent : rien n'est publié"; exit 1; }
          for f in Sillage_aarch64.app.tar.gz Sillage_x64.app.tar.gz; do
            test -f "dist/$f" || echo "::warning::$f absent : macOS sera ajouté en relançant le job en échec"
          done

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="-n 10"; fi
          git log $range --pretty=format:'- %s' --no-merges > notes.md
          echo >> notes.md

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Sign updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd dist
          for f in "Sillage_${VERSION}_x64-setup.exe" Sillage_aarch64.app.tar.gz Sillage_x64.app.tar.gz; do
            if [ -f "$f" ]; then npx --yes @tauri-apps/cli@2.12.6 signer sign "$f"; fi
          done

      - name: Version-less copies
        run: |
          cd dist
          cp "Sillage_${VERSION}_x64-setup.exe" Sillage_x64-setup.exe
          for a in aarch64 x64; do
            if [ -f "Sillage_${VERSION}_${a}.dmg" ]; then cp "Sillage_${VERSION}_${a}.dmg" "Sillage_${a}.dmg"; fi
          done

      - name: Manifest and checksums
        run: |
          node scripts/latest-json.mjs dist "$VERSION" notes.md > dist/latest.json
          cd dist && shopt -s nullglob && sha256sum *.exe *.dmg *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error

  # only job with write access to the repository: it runs no build step and holds no signing secret
  github-release:
    needs: sign
    if: ${{ !cancelled() && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # created by release-please: attach the files, keep its changelog
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "Sillage $version"
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" dist/* --title "Sillage $version" --notes-file notes.md
          fi

  notify-failure:
    needs: [bundle, sign, github-release]
    # a job GitHub could not start ends "cancelled", not "failure": both must alert
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$PUSHOVER_TOKEN" || exit 0
          curl -fsS -m 10 -o /dev/null --form-string "token=$PUSHOVER_TOKEN" --form-string "user=$PUSHOVER_USER" \
            --form-string "title=❌ Sillage : échec de la release" --form-string "priority=1" --form-string "url=$RUN_URL" \
            --form-string "message=La release $GITHUB_REF_NAME est incomplète ou n'a pas abouti. Voir les logs." \
            https://api.pushover.net/1/messages.json || true
