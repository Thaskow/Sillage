name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            platform: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            platform: darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            platform: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p "require('./src-tauri/tauri.conf.json').version")"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag invalide : $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          npm ci
          npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "{\"version\":\"$VERSION\"}"

      - name: Collect
        shell: bash
        run: |
          b="target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          case "${{ matrix.platform }}" in
            windows-x86_64)
              cp "$b/nsis/Sillage_${VERSION}_x64-setup.exe" out/ ;;
            darwin-aarch64)
              cp "$b"/dmg/*.dmg "out/Sillage_${VERSION}_aarch64.dmg"
              tar -czf out/Sillage_aarch64.app.tar.gz -C "$b/macos" Sillage.app ;;
            darwin-x86_64)
              cp "$b"/dmg/*.dmg "out/Sillage_${VERSION}_x64.dmg"
              tar -czf out/Sillage_x64.app.tar.gz -C "$b/macos" Sillage.app ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  # signs and publishes from the build artifacts only: no build tool or project dependency runs next to the signing key
  publish:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist

      - name: Version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag invalide : $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="-n 10"; fi
          git log $range --pretty=format:'- %s' --no-merges > notes.md
          echo >> notes.md

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Sign updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd dist
          for f in "Sillage_${VERSION}_x64-setup.exe" Sillage_aarch64.app.tar.gz Sillage_x64.app.tar.gz; do
            if [ -f "$f" ]; then npx --yes @tauri-apps/cli@2.12.6 signer sign "$f"; fi
          done

      - name: Manifest and checksums
        run: |
          node scripts/latest-json.mjs dist "$VERSION" notes.md > dist/latest.json
          cd dist && sha256sum *.exe *.dmg *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Sillage $VERSION" --notes-file notes.md
          fi
